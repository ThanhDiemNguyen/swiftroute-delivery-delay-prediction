[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftroute"
version = "0.1.0"
description = "Predict SwiftRoute shipment delays at pickup time"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
]

[tool.setuptools.packages.find]
include = ["swiftroute*"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
